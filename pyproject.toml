[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen36-2080ti"
version = "0.1.0"
description = "Qwen3.6 inference experiments for RTX 2080 Ti"
requires-python = ">=3.10"
dependencies = [
    "safetensors",
    "torch",
    "transformers",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
qwen36-run = "cli:main"

[tool.setuptools]
py-modules = ["checkpoint", "cli", "cuda_loader", "decode_state", "engine", "fp8_cuda", "fp8_smoke", "loader", "reference_ops", "runtime_config", "scheduler", "service", "tensor_parallel", "tp_runtime", "tp_weights", "weight_mapping", "worker"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
