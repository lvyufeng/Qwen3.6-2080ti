[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen36-2080ti"
version = "0.1.0"
description = "Qwen3.6 inference experiments for RTX 2080 Ti"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
qwen36-run = "cli:main"

[tool.setuptools]
py-modules = ["checkpoint", "cli", "fp8_smoke", "loader", "weight_mapping"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
